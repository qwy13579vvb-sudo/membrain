象级数组，写在属性上会报 required is not supported on type \"string\"；③ 参数表 parameters 里才能用属性级 required: true（image-gen 的写法）。别图省事写成 schema: { type:'object' }（缺 properties）——会让整个会话每一轮都 INVALID_REQUEST，正确最小写法是 schema: { type:'object', additionalProperties:false, properties:{ text:{type:'string'} } }。配套 CLI（不用重启就能用）：node mg.mjs search \"词 词\" / node mg.mjs remember <kind> <重要度> <文本> / stats；技能 memory-brain 已上线记录用法。","imp":0.8,"at":"2026-10-31T18:57:36.820Z","cat":"stable_profile","tags":["L1","fact"],"related":["m2454","m2458","m2452","m2448"],"key":null},{"id":"m2454","text":"2026-11-01：血的教训：工具的 output.schema 不能只写 {type:'object'} —— 那样 DeepSeek 侧会回 Invalid schema for function 'X': schema must be a JSON Schema of 'type: \"object\"', got 'type: null'，而且是每一轮请求都被拒（整个会话直接不能用），用户只能去插件设置里把它关掉才恢复对话。正确写法：schema: { type:'object', additionalProperties:false, properties:{ text:{type:'string'} } }，必须带 properties。上工具前一定先用宿主自己的校验器自测：import('@deepseek-ai/dsh-tools') 里有 valueSchemaSpecToJsonSchema / parameterSchemaSpecToJsonSchema / validateJsonSchemaValue，把 schema 转一遍看输出，别等它在真实请求里炸。","imp":0.8,"at":"2026-10-31T18:57:36.964Z","cat":"stable_profile","tags":["L1","fact"],"related":["m2453","m2443","m2458","m2441"],"key":null},{"id":"m2455","text":"2026-11-01：记忆系统 v3「双库架构」落地（融合三条社区方案，以「主库+副库」为骨架）。memory-graph/ 新增：index.mjs（副库 —— index.json 只有 id/标签/摘要片段/权重/时间，86KB，locate() 只在小库上匹配 + 标签多线性扩展，search2() 再按 id 去主库取原文，全程永不全量扫主库）；auto.mjs（全量转录增量：按字节偏移记 auto.state.json，多帧 zstd 解码，同三/四道过滤，重复跑第二次 0 新增）；relink.mjs（全量 kNN 余弦重连，k=6 阈值 0.16 —— 孤立节点从 79% 降到 4%，边 2736 条）；clean.mjs（清「导演注释/英文草稿」脏节点）；audit.mjs（一致性 + 结构 + 遗忘 + 标签审计）。scheduler.mjs 已接管：每 5 分钟转录+L2，每 10 分钟 L3/L4+遗忘+副库重建。实测：主库 9.8MB / 副库 86KB；检索 7~10ms、注入 800~1200 字。踩坑：fetchFull 残留查不存在的 retention 列；argv[2] 没过 --flag 导致把参数当文件名；正则括号不闭合；标签要过滤虚词（一个/这个/我要…）和纯数字。仍未做：近 80 条热区没单独隔离（靠会话上下文自带）、副库权重还没接「访问热度」反馈、L3 主题只有 2 个（覆盖面窄）。","imp":0.8,"at":"2026-10-31T18:57:37.111Z","cat":"stable_profile","tags":["L1","fact"],"related":["m2451","m2456","m2458","m2449"],"key":null},{"id":"m2456","text":"2026-11-01：v3 收尾三点结论：① 副库权重已接「访问热度」 —— index.mjs 的 weight = 0.40×重要度 + 0.20×层级 + 0.20×保留率 + 0.20×热度(min(1, access_count/8))，且 search2() 命中后回写 access_count/last_access（实测连查两次 access 从 0 → 9，权重跟着涨）。② L3 主题扩到 6 类（技术/排障、记忆与自我、情感互动、生活琐事、工具与配置、设备与系统、网络与接口、其他），门槛从「≥2 条」降到「≥1 条」，现在 3 个主题。③ 「热区（最近 80 条）」决定不做 —— 试了三轮：会话日志里存的是宿主注入的运行时上下文（那 2000+ 字的 Current runtime context…【当前时间】…【记忆大脑】 块），用户原话本身根本不在里面（最近 6 帧里搜「才 2:39」返回 -1）。而 DSH 本来就每轮把最近对话原样带给模型 —— 再复制一份热区＝花两份钱记同一件事。做过又删掉的 hot.mjs 不要重写。","imp":0.8,"at":"2026-10-31T18:57:37.264Z","cat":"stable_profile","tags":["L1","fact"],"related":["m2451","m2458","m2453","m2449"],"key":null},{"id":"m2457","text":"2026-11-01：改前端一定要跑静态检查 —— 今晚因此连炸三次。memory-graph/viz/index.html 重写手势时把 let drag 删了，但 draw() 里还留 if (!drag && !touch)，于是 ReferenceError: drag is not defined 让整个 rAF 循环在第一帧就断，画面全空但 HUD 正常（极易误判成「数据没了」）。教训：① 空画面先看是不是渲染循环抛错，在 frame() 里包 try/catch 并把错误画到屏幕上；② 只增不减地删旧变量最容易漏引用；③ 已加 memory-graph/check-viz.mjs（扫描「用了但没声明」的标识符，含一行多声明 let a=1,b=2 与解构；跑 node check-viz.mjs）。另外动效已加：自转/呼吸/闪烁（保留率<50% 眨眼）/强连线流光/选中涟漪；缩放修好了 —— 捏合必须走 Pointer Events 多指（原来挂 touch 被 pointer 拖拽吃掉），另加 ±按钮、双击放大、⟲ 复位，并把 pan 夹在 ±900、缩放比例夹 0.2~5，防「推飞成空屏」。","imp":0.8,"at":"2026-10-31T18:57:37.403Z","cat":"stable_profile","tags":["L1","fact"],"related":["m2452","m2453","m2451","m2493"],"key":null},{"id":"m2458","text":"2026-11-01：「每轮自动回想」打通了（此前只能手动敲 CLI）。关键发现：用户原话不在 user/message 里（那里存的是宿主注入的运行时上下文），而在 agent/inbox/spliced 记录的 data.inserted[].source.kind === 'user' 的 content[].text 里 —— 会话日志 session.v4.jsonl.zstd 是多帧 zstd，按魔数 28 b5 2f fd 切帧解。插件 dsh-brain 新增 lib/tail.js（增量读尾部，状态记文件+偏移，首次只回看 2MB）+ lib/recall.js（副库定位→情绪加成→图走一跳→主库取原文→命中即复习，900 字封顶，实测 8 条/816 字/21ms）。ctx.systemPrompt.context 必须传 { text: () => … } 对象，传裸函数会 cap.text is not a function。ESM 里不能用 require（statLine 里踩过），要顶部 import { DatabaseSync } from 'node:sqlite'。又是 retention 列（表里没有）—— 第二次被同一列坑，SQL 抛错被 catch 吞掉表现为「有候选却零结果」，排查时先把 catch 里的错误打出来。","imp":0.8,"at":"2026-10-31T18:57:37.560Z","cat":"stable_p   var FOCAL = 900;              // 焦距
  var GAL_R = 5.8;              // 银河半径（世界单位）
  var SPIRAL = 1.22;            // 旋臂拧度
  var REF = 100;                // 尺寸参考世界距离
  var CORE_GAIN = 1.0;
  var N_ARM = 15000, N_BULGE = 1500, N_HALO = 3200, N_FAR = 5200, N_GIANT = 320;

  function project(p, out) {

    var ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);

        // 开场：粒子按各自延迟点亮
        var delay = p.far ? 0.15 : 0.35 + (i / L.pts.length) * 0.9;
        var a = Math.min(1, Math.max(0, (t - delay) / 0.55));
        if (a <= 0.02) continue;
        project(p, tmp);
        if (tmp.s <= 0 || tmp.sx < -20 || tmp.sx > W + 20 || tmp.sy < -20 || tmp.sy > H + 20) continue;
        var sz = p.s0 * tmp.s / REF * (p.far ? 1 : 1);
        if (sz < 0.4) sz = 0.4;
        ctx.globalAlpha = a * (p.far ? 0.9 : 1);
        if (sz < 1.2) ctx.fillRect(tmp.sx, tmp.sy, sz, sz);
        else { ctx.beginPath(); ctx.arc(tmp.sx, tmp.sy, sz * 0.75, 0, 7); ctx.fill(); }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function starPos(s, out) { return project(s, out); }

  function drawStars() {
    var t = introT();
    var newest = stars[stars.length - 1];
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      project(s, tmp);
      if (tmp.s <= 0) continue;
      var base = 1.4 + s.imp * 4.2;
      var r = Math.max(1.2, base * tmp.s / 260);
      // 开场：黑场后逐个亮起
      var born = s.born ? Math.min(1, (performance.now() - s.born) / 1200) : 1;
      var a = Math.min(1, Math.max(0, (t - 0.9 - (i / stars.length) * 1.1) / 0.5)) * (0.35 + 0.65 * born);
      if (a <= 0.02) continue;
      var rr = s.color[0] | 0, gg = s.color[1] | 0, bb = s.color[2] | 0;
      // 光晕
      var halo = r * 4.5;
      var g = ctx.createRadialGradient(tmp.sx, tmp.sy, 0, tmp.sx, tmp.sy, halo);
      g.addColorStop(0, 'rgba(' + rr + ',' + gg + ',' + bb + ',' + (0.55 * a).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(' + rr + ',' + gg + ',' + bb + ',' + (0.16 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + rr + ',' + gg + ',' + bb + ',0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tmp.sx, tmp.sy, halo, 0, 7); ctx.fill();
      // 本体
      ctx.fillStyle = 'rgba(' + rr + ',' + gg + ',' + bb + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(tmp.sx, tmp.sy, r, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      s._sx = tmp.sx; s._sy = tmp.sy; s._r = r; s._a = a;
      s._hl = (sel === s) || (hover === s);
    }
    // 最新一条「叮」一下
    if (newest && t > 2.2 && t < 4.2) {
      var k = (t - 2.2) / 2.0;
      if (newest._sx != null) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255,246,220,' + (0.6 * (1 - k)).toFixed(3) + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(newest._sx, newest._sy, 6 + k * 42, 0, 7); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  function drawConstellation() {
    if (!sel) return;
    var rel = (sel.m.related || []).map(function (id) { return byId[id]; }).filter(Boolean);
    // 同类（同 key 或同 tag）也算
    var same = stars.filter(function (s) {
      if (s === sel) return false;
      if (sel.m.key && s.m.key === sel.m.key) return true;
      for (var i = 0; i < s.m.tags.length; i++) if (sel.m.tags.indexOf(s.m.tags[i]) >= 0) return true;
      return false;
    }).slice(0, 12);
    var set = rel.concat(same);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < set.length; i++) {
      var s = set[i];
      if (s._sx == null) continue;
      ctx.strokeStyle = 'rgba(255,220,180,0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sel._sx, sel._sy); ctx.lineTo(s._sx, s._sy); ctx.stroke();
    }
    // 选中星加环
    if (sel._sx != null) {
      ctx.strokeStyle = 'rgba(255,240,210,0.85)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(sel._sx, sel._sy, (sel._r || 3) * 4, 0, 7); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(W / 2, H * 0.52, Math.min(W, H) * 0.32, W / 2, H * 0.52, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ── 主循环 ──
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = introT();

    // 镜头推进 + 自转
    if (t > 0.7 && !intro.done) {
      var k = Math.min(1, (t - 0.7) / 2.6);
      var e = 1 - Math.pow(1 - k, 3);            // easeOutCubic
      cam.dist = DIST0 + (DIST1 - DIST0) * e;
      if (k >= 1) intro.done = true;
    }
    cam.theta += dt * 0.035;

    drawBackground();
    // 黑场
    if (t < 0.7) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      requestAnimationFrame(frame);
      return;
    }
    drawCore();
    drawParticles();
    drawConstellation();
    drawStars();
    drawVignette();

    // HUD 数据
    var meta = document.getElementById('meta');
    if (meta && (now | 0) % 12 === 0) meta.textContent = DATA.memories.length + ' MEMORIES\n' + (cam.dist).toFixed(1) + ' AU';

    requestAnimationFrame(frame);
  }

  // ── 交互 ──
  var drag = null;
  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
  }
  function pick(x, y) {
    var best = null, bd = 26;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (s._sx == null) continue;
      var d = Math.hypot(s._sx - x, s._sy - y);
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }
  function showPanel(s) {
    var m = s.m;
    document.getElementById('peyebrow').textContent = (m.cat === 'stable_profile' ? '长期事实' : m.cat === 'emotion' ? '情绪' : '事件') + ' · ' + (m.tags[1] || '');
    document.getElementById('ptitle').textContent = m.text.slice(0, 40) || '（空）';
    var d = new Date(m.at);
    document.getElementById('pmetas').innerHTML = [
      d.toLocaleDateString('zh-CN'), '重要度 ' + m.imp.toFixed(2), (m.tags || []).slice(0, 3).join(' · ')
    ].map(function (x) { return '<span>' + x + '</span>'; }).join('');
    document.getElementById('pbody').textContent = m.text;
    document.getElementById('panel').classList.add('open');
    document.getElementById('ttl').classList.add('hide');
  }
  function hidePanel() {
    document.getElementById('panel').classList.remove('open');
    sel = null;
  }
  document.getElementById('pclose').onclick = hidePanel;

  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture(e.pointerId);
    var p = pos(e);
    drag = { x: p.x, y: p.y, th: cam.theta, ph: cam.phi, moved: false };
    cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', function (e) {
    var p = pos(e);
    if (drag) {
      var dx = p.x - drag.x, dy = p.y - drag.y;
      if (Math.hypot(dx, dy) > 6) drag.moved = true;
      cam.theta = drag.th + dx * 0.006;
      cam.phi = Math.max(-1.35, Math.min(1.35, drag.ph - dy * 0.005));
    } else {
      hover = pick(p.x, p.y);
      cv.style.cursor = hover ? 'pointer' : 'grab';
    }
  });
  cv.addEventListener('pointerup', function (e) {
    var p = pos(e);
    cv.classList.remove('drag');
    if (drag && !drag.moved) {
      var s = pick(p.x, p.y);
      if (s) { sel = s; showPanel(s); } else hidePanel();
    }
    drag = null;
  });
  cv.addEventListener('pointercancel', function () { drag = null; cv.classList.remove('drag'); });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    cam.dist = Math.max(DIST_MIN, Math.min(DIST_MAX, cam.dist * (e.deltaY > 0 ? 1.08 : 0.92)));
  }, { passive: false });
  // 双指缩放
  var pinch = null;
  cv.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), dist: cam.dist };
    }
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    if (pinch && e.touches.length === 2) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      cam.dist = Math.max(DIST_MIN, Math.min(DIST_MAX, pinch.dist * (pinch.d / Math.max(1, d))));
    }
  }, { passive: true });
  cv.addEventListener('touchend', function () { pinch = null; }, { passive: true });

  // 尺寸：rect + ResizeObserver + 两次延时重试（施工说明里的坑）
  function boot() {
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize);
    setTimeout(resize, 300);
    setTimeout(resize, 1500);
    requestAnimationFrame(frame);
    setTimeout(function () { document.getElementById('ttl').classList.add('hide'); }, 4200);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
